name: Archive CI results without changing the test verdict
description: Best-effort archive with an explicit warning and Actions summary on failure.
inputs:
  name:
    description: Artifact name
    required: true
  path:
    description: Paths to archive
    required: true
  retention-days:
    description: Archive retention
    default: '7'
  if-no-files-found:
    description: Missing-file behaviour of the archive step only
    default: warn
runs:
  using: composite
  steps:
    - name: Upload archive
      id: archive
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
    - name: Publish archive status
      if: always()
      shell: bash
      env:
        ARCHIVE_NAME: ${{ inputs.name }}
        ARCHIVE_OUTCOME: ${{ steps.archive.outcome }}
        ARCHIVE_URL: ${{ steps.archive.outputs.artifact-url }}
      run: |
        printf '### Archive: %s\n\n' "$ARCHIVE_NAME" >> "$GITHUB_STEP_SUMMARY"
        if [[ "$ARCHIVE_OUTCOME" == success ]]; then
          if [[ -n "$ARCHIVE_URL" ]]; then
            printf 'Uploaded: %s\n\n' "$ARCHIVE_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'No files uploaded; see the archive step log.\n\n' >> "$GITHUB_STEP_SUMMARY"
          fi
        else
          echo '::warning::Archive unavailable (for example, GitHub artifact storage quota). Test and scanner failures are still blocking; see job logs and summaries.'
          printf '**Archive unavailable.** Check the upload log and GitHub storage quota. Test/build/scanner results are unchanged; no downloadable artifact is confirmed.\n\n' >> "$GITHUB_STEP_SUMMARY"
        fi
