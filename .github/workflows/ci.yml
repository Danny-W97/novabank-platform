name: Bank-demo CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bank-demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mermaid-validation:
    name: Mermaid syntax (unchanged historical exceptions are hash-bound)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/ci/mermaid/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --prefix scripts/ci/mermaid
      - run: node scripts/ci/mermaid/check.mjs

  security-checks:
    name: Security scan (${{ matrix.scan }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scan: [secrets, dependencies]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B scripts/ci/security_checks.py ${{ matrix.scan }}
      - uses: ./.github/actions/archive-results
        if: always()
        with:
          name: security-${{ matrix.scan }}
          path: target/security/*.json
          retention-days: 7

  control-center-tests:
    name: Control Center Python and JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated Python tests (live SQL/systemd tests stay opt-in)
        run: python3 -B -m unittest discover -s scripts/control-center/web -p 'test_*.py'
      - name: Candidate source export tests
        run: python3 -B -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Committed public source release gate
        run: python3 -B scripts/ci/release_check.py
      - name: JavaScript UI regressions
        run: python3 -B scripts/ci/js_tests.py
      - name: Payment case read model on disposable PostgreSQL
        env:
          NOVABANK_PAYMENT_CASES_SQL_TEST: '1'
        run: python3 -B -m unittest discover -s scripts/control-center/web -p 'test_payment_cases_sql.py'
      - name: Flyway status on disposable PostgreSQL
        env:
          NOVABANK_FLYWAY_SQL_TEST: '1'
        run: python3 -B -m unittest discover -s scripts/control-center/web -p 'test_flyway_status.py'
  unit-tests:
    name: Unit tests (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [bank, shop]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run bank unit tests
        if: matrix.app == 'bank'
        run: ./mvnw -B -ntp -Punit-tests test

      - name: Run shop unit tests
        if: matrix.app == 'shop'
        run: ./mvnw -B -ntp -f shop-app/pom.xml -Punit-tests test

  integration-tests:
    name: Testcontainers integration tests (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: [unit-tests, control-center-tests, mermaid-validation, security-checks]
    strategy:
      fail-fast: false
      matrix:
        app: [bank, shop]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run bank integration tests
        if: matrix.app == 'bank'
        run: ./mvnw -B -ntp -Pintegration-tests verify

      - name: Run shop integration tests
        if: matrix.app == 'shop'
        run: ./mvnw -B -ntp -f shop-app/pom.xml -Pintegration-tests verify

      - name: Synthetic TOTP backup recovery (isolated Docker and packaged verifier)
        if: matrix.app == 'bank'
        env:
          NOVABANK_TOTP_RECOVERY_TEST: '1'
        run: |
          docker pull postgres:18
          python3 -B -m unittest discover -s scripts/control-center/web -p test_totp_recovery_live.py

  e2e:
    name: HTTP E2E bank + shop
    runs-on: ubuntu-latest
    needs: integration-tests
    services:
      bank-postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bankdb
          POSTGRES_USER: bankuser
          POSTGRES_PASSWORD: bankpass
        ports:
          - 5300:5432
        options: >-
          --health-cmd "pg_isready -U bankuser -d bankdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      shop-postgres:
        image: postgres:18
        env:
          POSTGRES_DB: shopdb
          POSTGRES_USER: shopuser
          POSTGRES_PASSWORD: shoppass
        ports:
          - 5400:5432
        options: >-
          --health-cmd "pg_isready -U shopuser -d shopdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build bank and shop JARs
        run: |
          ./mvnw -B -ntp -DskipTests package
          ./mvnw -B -ntp -f shop-app/pom.xml -DskipTests package

      - name: Start bank
        env:
          TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5300/bankdb
          TEST_POSTGRES_USER: bankuser
          TEST_POSTGRES_PASSWORD: bankpass
          TEST_REDIS_HOST: 127.0.0.1
          TEST_REDIS_PORT: 6379
          TEST_BANK_API_KEY: ci-bank-key
        run: |
          export TEST_TOTP_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          nohup java -jar target/Bank-demo-0.0.1-SNAPSHOT.jar \
            --spring.profiles.active=test \
            --server.port=8080 \
            --management.server.port=8082 \
            > /tmp/bank-e2e.log 2>&1 &

      - name: Start shop
        env:
          TEST_SHOP_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5400/shopdb
          TEST_SHOP_POSTGRES_USER: shopuser
          TEST_SHOP_POSTGRES_PASSWORD: shoppass
          TEST_REDIS_HOST: 127.0.0.1
          TEST_REDIS_PORT: 6379
          TEST_BANK_BASE_URL: http://127.0.0.1:8080
          TEST_BANK_API_KEY: ci-bank-key
          TEST_BANK_API_KEY_ID: legacy
          # Keep the CI merchant account as a quoted string so YAML does not
          # coerce the leading-zero account number to a numeric value.
          TEST_SHOP_MERCHANT_ACCOUNT: "00000000000000000000000000"
          SHOP_MERCHANT_ACCOUNT_NUMBER: "00000000000000000000000000"
        run: |
          nohup java -jar shop-app/target/shop-app-0.0.1-SNAPSHOT.jar \
            --spring.profiles.active=test \
            --server.port=8081 \
            --management.server.port=8083 \
            > /tmp/shop-e2e.log 2>&1 &

      - name: Run real HTTP E2E flow
        env:
          BANK_URL: http://127.0.0.1:8080
          SHOP_URL: http://127.0.0.1:8081
          BANK_API_KEY: ci-bank-key
          BANK_API_KEY_ID: legacy
        run: bash scripts/e2e-smoke.sh

      - name: Upload application logs
        if: always()
        uses: ./.github/actions/archive-results
        with:
          name: e2e-application-logs
          path: /tmp/*-e2e.log
          if-no-files-found: ignore

  audit-extended:
    name: Isolated transport and DEV/TEST load acceptance
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B scripts/ci/audit_extended_verify.py transport
      - if: github.event_name == 'workflow_dispatch'
        run: python3 -B scripts/ci/audit_extended_verify.py load
      - uses: ./.github/actions/archive-results
        if: always()
        with:
          name: audit-extended-evidence
          path: target/audit-extended/
          retention-days: 7

  security-k4:
    name: K4 application authorization acceptance
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Complete K4 policy, HTTP boundary and business evidence
        run: python3 -B scripts/ci/audit_extended_verify.py k4
      - uses: ./.github/actions/archive-results
        if: always()
        with:
          name: security-k4-evidence
          path: target/audit-extended/k4/
          retention-days: 7

  package:
    name: Build delivery artifacts
    runs-on: ubuntu-latest
    needs: [e2e, audit-extended, security-k4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Package bank and shop
        run: |
          ./mvnw -B -ntp -DskipTests package
          ./mvnw -B -ntp -f shop-app/pom.xml -DskipTests package
          test -s target/Bank-demo-0.0.1-SNAPSHOT.jar
          test -s shop-app/target/shop-app-0.0.1-SNAPSHOT.jar
          sha256sum target/Bank-demo-0.0.1-SNAPSHOT.jar shop-app/target/shop-app-0.0.1-SNAPSHOT.jar

      - name: Upload JAR artifacts
        uses: ./.github/actions/archive-results
        with:
          name: bank-demo-jars
          path: |
            target/*.jar
            shop-app/target/*.jar
          if-no-files-found: error
