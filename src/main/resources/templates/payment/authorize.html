<!doctype html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <title>Potwierdzenie płatności | NovaBank</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/public.css}" rel="stylesheet">
</head>
<body class="public-body">
<main class="public-shell">
    <section class="auth-panel mx-auto" style="max-width: 560px; min-height: 100vh; display: grid; place-items: center;">
        <div class="auth-card w-100">
            <div class="auth-heading">
                <span class="auth-icon">🏦</span>
                <h1>Potwierdź płatność</h1>
                <p>NovaTech Shop prosi o wykonanie płatności z Twojego rachunku NovaBank.</p>
            </div>

            <div class="alert alert-light border">
                <div class="d-flex justify-content-between gap-3 mb-2">
                    <span>Kwota</span>
                    <strong th:text="${authorization.amount + ' ' + authorization.currency}">100.00 PLN</strong>
                </div>
                <div class="d-flex justify-content-between gap-3">
                    <span>Opis</span>
                    <strong th:text="${authorization.title}">Zamówienie sklepu</strong>
                </div>
            </div>

            <p class="text-muted small">Rachunek źródłowy zostanie wybrany na podstawie Twojej aktywnej sesji bankowej. Sklep nie otrzymuje Twojego hasła.</p>

            <div th:if="${authorization.status.name() != 'PENDING'}" class="alert alert-warning">
                To żądanie płatności nie jest już aktywne.
            </div>

            <div th:if="${authorization.status.name() == 'PENDING'}" class="d-flex gap-2">
                <form class="flex-fill" method="post" th:action="@{/shop/authorize/{id}/reject(id=${authorization.id})}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button class="btn btn-outline-secondary w-100" type="submit">Anuluj</button>
                </form>
                <form class="flex-fill" method="post" th:action="@{/shop/authorize/{id}/approve(id=${authorization.id})}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button class="btn btn-primary w-100" type="submit">Potwierdź płatność</button>
                </form>
            </div>
        </div>
    </section>
</main>
</body>
</html>
