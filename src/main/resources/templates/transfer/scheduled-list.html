<!doctype html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/app-layout :: layout('Przelewy zaplanowane', 'transfer', ~{::main})}">
<main>
    <div class="page-heading">
        <div><span class="page-eyebrow">Przelewy</span><h1>Przelewy zaplanowane</h1><p>Jednorazowe i cykliczne zlecenia wykonania przelewu.</p></div>
        <a class="btn app-btn-primary" th:href="@{/scheduled-transfers/new}"><i class="bi bi-plus-lg"></i> Nowy przelew</a>
    </div>
    <div class="profile-alert" th:if="${scheduledSuccess}" th:text="${scheduledSuccess}">Gotowe</div>
    <div class="profile-alert admin-alert-error" th:if="${scheduledError}" th:text="${scheduledError}">Błąd</div>
    <section class="app-card">
        <div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Odbiorca</th><th>Kwota</th><th>Częstotliwość</th><th>Następne wykonanie</th><th>Status</th><th></th></tr></thead>
            <tbody><tr th:each="scheduled : ${scheduledTransfers}">
                <td><strong th:text="${scheduled.recipientName}">Odbiorca</strong><small class="d-block" th:text="${scheduled.destinationAccountNumber}">00</small></td>
                <td th:text="${scheduled.amount + ' PLN'}">0 PLN</td>
                <td th:text="${scheduled.frequency}">WEEKLY</td>
                <td th:text="${scheduled.nextExecutionAt}">Data</td>
                <td><span th:if="${scheduled.active}" class="badge rounded-pill text-bg-success">Aktywny</span><span th:unless="${scheduled.active}" class="badge rounded-pill text-bg-secondary">Anulowany</span><small class="d-block text-danger" th:if="${scheduled.lastError}" th:text="${scheduled.lastError}"></small></td>
                <td><form th:if="${scheduled.active}" th:action="@{/scheduled-transfers/{id}/cancel(id=${scheduled.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-danger" type="submit">Anuluj</button></form></td>
            </tr><tr th:if="${#lists.isEmpty(scheduledTransfers)}"><td colspan="6" class="text-muted py-4">Brak zaplanowanych przelewów.</td></tr></tbody>
        </table></div>
    </section>
</main>
</html>
