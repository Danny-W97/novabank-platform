<!doctype html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <title>Potwierdzenie logowania | NovaBank</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/public.css}" rel="stylesheet">
</head>
<body class="public-body">
<main class="public-shell">
    <section class="public-hero" aria-labelledby="two-factor-title">
        <a class="brand brand-light" th:href="@{/login}">
            <span class="brand-mark"><i class="bi bi-bank2"></i></span>
            <span>NovaBank</span>
            <small>DEMO</small>
        </a>
        <div class="hero-copy">
            <span class="eyebrow"><i class="bi bi-shield-check"></i> Dodatkowe zabezpieczenie</span>
            <h1 id="two-factor-title">Potwierdź logowanie.</h1>
            <p>Wpisz aktualny kod z aplikacji Google Authenticator.</p>
        </div>
    </section>
    <section class="auth-panel" aria-labelledby="two-factor-form-title">
        <div class="auth-card">
            <div class="auth-heading">
                <span class="auth-icon"><i class="bi bi-phone"></i></span>
                <h2 id="two-factor-form-title">Kod bezpieczeństwa</h2>
                <p th:text="${twoFactorEmail}">użytkownik@example.pl</p>
            </div>
            <div class="form-alert form-alert-error" th:if="${param.error}">
                <i class="bi bi-exclamation-circle"></i>
                Nieprawidłowy kod albo kod odzyskiwania.
            </div>
            <form th:action="@{/login/2fa}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="form-field">
                    <label for="code">Kod 2FA lub kod odzyskiwania</label>
                    <div class="input-with-icon">
                        <i class="bi bi-key"></i>
                        <input id="code" name="code" type="text" inputmode="text"
                               autocomplete="one-time-code" maxlength="32" required autofocus>
                    </div>
                </div>
                <button class="primary-button" type="submit">
                    Potwierdź <i class="bi bi-arrow-right"></i>
                </button>
            </form>
            <p class="auth-legal">Kod wygasa po krótkim czasie. Po pięciu błędnych próbach logowanie zostanie przerwane.</p>
        </div>
    </section>
</main>
</body>
</html>
