<!doctype html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Potwierdź e-mail | NovaBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/public.css}" rel="stylesheet">
</head>
<body class="public-body">
<main class="public-shell single-auth-shell">
    <section class="auth-panel">
        <div class="auth-card">
            <div class="auth-heading">
                <span class="auth-icon"><i class="bi bi-envelope-check"></i></span>
                <h1>Sprawdź swoją skrzynkę</h1>
                <p>Na adres <strong th:text="${email}">email@example.pl</strong> wysłaliśmy link potwierdzający.</p>
            </div>
            <div class="form-alert form-alert-success" th:if="${verificationSent}">
                <i class="bi bi-check-circle"></i>
                <span th:text="${verificationSent}">Wysłaliśmy nowy link.</span>
            </div>
            <p class="auth-instruction">W trybie deweloperskim link jest także wypisywany w logu aplikacji. Link jest ważny 24 godziny.</p>
            <form th:action="@{/verify-email/resend}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="email" th:value="${email}">
                <button class="primary-button" type="submit">Wyślij ponownie</button>
            </form>
            <p class="auth-legal auth-back"><a th:href="@{/login}">Wróć do logowania</a></p>
        </div>
    </section>
</main>
</body>
</html>
