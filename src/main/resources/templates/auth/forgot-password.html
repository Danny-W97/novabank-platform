<!doctype html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset hasła | NovaBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/public.css}" rel="stylesheet">
</head>
<body class="public-body">
<main class="public-shell single-auth-shell">
    <section class="auth-panel">
        <div class="auth-card">
            <div class="auth-heading">
                <span class="auth-icon"><i class="bi bi-key"></i></span>
                <h1>Nie pamiętasz hasła?</h1>
                <p>Podaj adres e-mail, a wyślemy instrukcję ustawienia nowego hasła.</p>
            </div>
            <div class="form-alert form-alert-success" th:if="${resetRequested}">
                <i class="bi bi-check-circle"></i>
                <span th:text="${resetRequested}">Wysłaliśmy instrukcję.</span>
            </div>
            <form th:action="@{/password/forgot}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="form-field">
                    <label for="email">Adres e-mail</label>
                    <input id="email" name="email" type="email" maxlength="254" required autofocus>
                </div>
                <button class="primary-button" type="submit">Wyślij instrukcję</button>
            </form>
            <p class="auth-legal auth-back"><a th:href="@{/login}">Wróć do logowania</a></p>
        </div>
    </section>
</main>
</body>
</html>
