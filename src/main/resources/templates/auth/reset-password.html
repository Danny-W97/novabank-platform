<!doctype html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ustaw nowe hasło | NovaBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/public.css}" rel="stylesheet">
</head>
<body class="public-body">
<main class="public-shell single-auth-shell">
    <section class="auth-panel">
        <div class="auth-card">
            <div class="auth-heading">
                <span class="auth-icon"><i class="bi bi-shield-lock"></i></span>
                <h1>Ustaw nowe hasło</h1>
                <p>Wybierz hasło, którego użyjesz przy następnym logowaniu.</p>
            </div>
            <div class="form-alert form-alert-error" th:if="${resetError}">
                <i class="bi bi-exclamation-circle"></i>
                <span th:text="${resetError}">Link wygasł.</span>
            </div>
            <form th:action="@{/password/reset}" th:object="${passwordResetForm}" method="post" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="token" th:value="${token}">
                <div class="form-field">
                    <label for="newPassword">Nowe hasło</label>
                    <input id="newPassword" type="password" th:field="*{newPassword}" minlength="8" maxlength="72" required>
                    <p class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}">Błąd hasła</p>
                </div>
                <div class="form-field">
                    <label for="passwordConfirmation">Powtórz hasło</label>
                    <input id="passwordConfirmation" type="password" th:field="*{passwordConfirmation}" maxlength="72" required>
                    <p class="field-error" th:if="${#fields.hasErrors('passwordConfirmation')}" th:errors="*{passwordConfirmation}">Błąd potwierdzenia</p>
                </div>
                <button class="primary-button" type="submit">Zapisz nowe hasło</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
