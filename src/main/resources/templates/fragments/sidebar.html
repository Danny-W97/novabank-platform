<!doctype html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<aside class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="appSidebar"
       aria-labelledby="appSidebarLabel" th:fragment="sidebar(activePage, initials, fullName)">
    <div class="offcanvas-header sidebar-mobile-header">
        <a class="brand brand-light" th:href="@{/dashboard}" id="appSidebarLabel">
            <span class="brand-mark"><i class="bi bi-bank2" aria-hidden="true"></i></span>
            <span>NovaBank</span>
        </a>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                data-bs-target="#appSidebar" aria-label="Zamknij menu"></button>
    </div>

    <div class="sidebar-content">
        <a class="brand brand-light sidebar-brand" th:href="@{/dashboard}">
            <span class="brand-mark"><i class="bi bi-bank2" aria-hidden="true"></i></span>
            <span>NovaBank</span>
            <small>DEMO</small>
        </a>

        <nav class="sidebar-nav" aria-label="Główna nawigacja">
            <a th:href="@{/dashboard}" th:classappend="${activePage == 'dashboard'} ? ' active'"
               th:attr="aria-current=${activePage == 'dashboard' ? 'page' : null}">
                <i class="bi bi-grid-1x2" aria-hidden="true"></i><span>Dashboard</span>
            </a>
            <a th:href="@{/transfer}" th:classappend="${activePage == 'transfer'} ? ' active'"
               th:attr="aria-current=${activePage == 'transfer' ? 'page' : null}">
                <i class="bi bi-arrow-left-right" aria-hidden="true"></i><span>Przelew</span>
            </a>
            <a th:href="@{/scheduled-transfers}" th:classappend="${activePage == 'transfer'} ? ' active'">
                <i class="bi bi-calendar-event" aria-hidden="true"></i><span>Przelewy zaplanowane</span>
            </a>
            <a th:href="@{/exchange}" th:classappend="${activePage == 'exchange'} ? ' active'"
               th:attr="aria-current=${activePage == 'exchange' ? 'page' : null}">
                <i class="bi bi-currency-exchange" aria-hidden="true"></i><span>Kantor</span>
            </a>
            <a th:href="@{/card}" th:classappend="${activePage == 'card'} ? ' active'"
               th:attr="aria-current=${activePage == 'card' ? 'page' : null}">
                <i class="bi bi-credit-card-2-front" aria-hidden="true"></i><span>Karta</span>
            </a>
            <a th:href="@{/history}" th:classappend="${activePage == 'history'} ? ' active'"
               th:attr="aria-current=${activePage == 'history' ? 'page' : null}">
                <i class="bi bi-clock-history" aria-hidden="true"></i><span>Historia</span>
            </a>
            <a th:href="@{/recipients}" th:classappend="${activePage == 'recipients'} ? ' active'"
               th:attr="aria-current=${activePage == 'recipients' ? 'page' : null}">
                <i class="bi bi-people" aria-hidden="true"></i><span>Odbiorcy</span>
            </a>
            <a th:href="@{/notifications}" th:classappend="${activePage == 'notifications'} ? ' active'"
               th:attr="aria-current=${activePage == 'notifications' ? 'page' : null}">
                <i class="bi bi-bell" aria-hidden="true"></i><span>Powiadomienia</span>
            </a>
            <a th:href="@{/profile}" th:classappend="${activePage == 'profile'} ? ' active'"
               th:attr="aria-current=${activePage == 'profile' ? 'page' : null}">
                <i class="bi bi-person" aria-hidden="true"></i><span>Profil</span>
            </a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}"
               th:classappend="${activePage == 'admin'} ? ' active'"
               th:attr="aria-current=${activePage == 'admin' ? 'page' : null}">
                <i class="bi bi-shield-lock" aria-hidden="true"></i><span>Administracja</span>
            </a>
        </nav>

        <div class="sidebar-user">
            <div class="avatar avatar-sm" th:text="${initials}" aria-hidden="true">JK</div>
            <div>
                <strong th:text="${fullName}">Jan Kowalski</strong>
                <span>Konto osobiste</span>
            </div>
        </div>
    </div>
</aside>
</body>
</html>
