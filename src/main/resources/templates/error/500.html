<!doctype html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Błąd aplikacji | NovaBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/public.css}" rel="stylesheet">
</head>
<body class="public-body error-page">
<main class="public-page">
    <section class="error-content" aria-labelledby="error-title">
        <a class="brand brand-light" th:href="@{/login}">
            <span class="brand-mark"><i class="bi bi-bank2"></i></span>
            <span>NovaBank</span>
        </a>
        <p class="error-code">500</p>
        <h1 id="error-title">Wystąpił błąd aplikacji</h1>
        <p>Nie udało się teraz obsłużyć żądania. Spróbuj ponownie za chwilę.</p>
        <div class="public-page-actions">
            <a class="primary-button" th:href="@{/login}">Wróć do logowania <i class="bi bi-arrow-right"></i></a>
        </div>
    </section>
</main>
</body>
</html>
